name: XAUUSD 2021-2022 CLEAN

on:
  workflow_dispatch:

jobs:
  download-month:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: ["2021", "2022"]
        month: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Download one month
        env:
          YEAR: ${{ matrix.year }}
          MONTH: ${{ matrix.month }}
        run: |
          python - << 'PY'
          import os, csv, lzma, struct, zipfile, calendar, time
          from datetime import datetime, timedelta
          import requests

          SYMBOL="XAUUSD"
          YEAR=int(os.environ["YEAR"])
          MONTH=int(os.environ["MONTH"])
          PRICE_DIVISOR=1000.0

          os.makedirs("output", exist_ok=True)
          csv_path=f"XAUUSD_TICK_{YEAR}_{MONTH:02d}_DUKASCOPY.csv"
          zip_path=f"output/XAUUSD_TICK_{YEAR}_{MONTH:02d}_DUKASCOPY.zip"

          def url(y,m,d,h):
              return f"https://datafeed.dukascopy.com/datafeed/{SYMBOL}/{y}/{m-1:02d}/{d:02d}/{h:02d}h_ticks.bi5"

          def download_hour(y,m,d,h):
              for _ in range(5):
                  try:
                      r=requests.get(url(y,m,d,h),timeout=60)
                      if r.status_code!=200 or not r.content:
                          return []
                      raw=lzma.decompress(r.content)
                      base=datetime(y,m,d,h)
                      rows=[]
                      for i in range(0,len(raw),20):
                          c=raw[i:i+20]
                          if len(c)<20:
                              continue
                          ms,ask_i,bid_i,ask_vol,bid_vol=struct.unpack(">IIIff",c)
                          t=base+timedelta(milliseconds=ms)
                          rows.append([
                              t.strftime("%Y-%m-%d %H:%M:%S.%f")[:-3],
                              bid_i/PRICE_DIVISOR,
                              ask_i/PRICE_DIVISOR,
                              bid_vol,
                              ask_vol
                          ])
                      return rows
                  except Exception as e:
                      print("retry error", e, flush=True)
                      time.sleep(5)
              return []

          days=calendar.monthrange(YEAR,MONTH)[1]
          total=0

          with open(csv_path,"w",newline="") as f:
              w=csv.writer(f)
              w.writerow(["time","bid","ask","bid_volume","ask_volume"])
              for d in range(1,days+1):
                  day_total=0
                  for h in range(24):
                      rows=download_hour(YEAR,MONTH,d,h)
                      if rows:
                          w.writerows(rows)
                          day_total+=len(rows)
                          total+=len(rows)
                  print(f"{YEAR}-{MONTH:02d}-{d:02d} ticks {day_total}", flush=True)

          with zipfile.ZipFile(zip_path,"w",zipfile.ZIP_DEFLATED) as z:
              z.write(csv_path,arcname=os.path.basename(csv_path))

          print(f"DONE {YEAR}_{MONTH:02d} total ticks {total}", flush=True)
          PY

      - name: Upload month
        uses: actions/upload-artifact@v4
        with:
          name: MONTH_XAUUSD_${{ matrix.year }}_${{ matrix.month }}
          path: output/*.zip
          retention-days: 7
          compression-level: 0

  combine-final:
    needs: download-month
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all months
        uses: actions/download-artifact@v4
        with:
          pattern: MONTH_XAUUSD_*
          path: final
          merge-multiple: true

      - name: Check count
        run: |
          COUNT=$(find final -name "*.zip" | wc -l)
          echo "ZIP count: $COUNT"
          if [ "$COUNT" -ne 24 ]; then
            echo "ERROR: 24 monthly zip expected"
            exit 1
          fi

      - name: Upload final
        uses: actions/upload-artifact@v4
        with:
          name: DOWNLOAD_XAUUSD_2021-2022
          path: final/*.zip
          retention-days: 7
          compression-level: 0